name: Mobile clients

on:
  push:
    branches:
      - feat/mobile-clients
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            curl -fLsS -o /tmp/android-cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/latest" /tmp/android-cli
            unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cli
            mv /tmp/android-cli/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tink-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Compile iOS Simulator app
        working-directory: mobile/ios
        run: >
          xcodebuild -project TinkMobile.xcodeproj
          -scheme TinkMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
